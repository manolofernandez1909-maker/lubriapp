<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VW VENTO 2.0 · Lubricentro Manolo</title>
<style>
  :root{--bg:#1c1f1a;--surface:#262b23;--border:#3a4033;--text:#ede9df;--muted:#9a9d8f;--amber:#e3a23c;--green:#7fa662;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:20px 16px 50px;}
  .wrap{max-width:480px;margin:0 auto;}
  .brand{color:var(--amber);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;}
  h1{margin:0 0 2px;font-size:22px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px;}
  .box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
  .box .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;}
  .box .n{font-size:18px;font-weight:800;color:var(--green);margin-top:2px;}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:0.05em;color:var(--amber);margin:22px 0 10px;}
  .s-item{border-bottom:1px dashed var(--border);padding:10px 0;}
  .s-item:last-child{border-bottom:none;}
  .s-fecha{font-weight:700;font-size:13.5px;}
  .s-km{color:var(--muted);font-weight:400;font-size:12px;}
  .s-detalle{font-size:13px;margin-top:3px;}
  .s-otros{font-size:12px;color:var(--muted);margin-top:2px;font-style:italic;}
  .footer{margin-top:24px;font-size:11px;color:var(--muted);text-align:center;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Lubricentro Manolo</div>
    <h1>VW VENTO 2.0</h1>
    <div class="sub">AB325SD · JULIAN FERNANDEZ</div>

    <div class="box">
      <div class="l">Próximo service estimado</div>
      <div class="n">20.000 km</div>
    </div>

    <h2>Historial de service</h2>
    <div class="s-item">
      <div class="s-fecha">08/08/2026 <span class="s-km">10.000 km</span></div>
      <div class="s-detalle">Aceite (VALVOLINE 5W30), Filtro de aceite, Filtro de aire</div>
      
    </div>

    <div class="footer">Página generada el 08/08/2026 · Lubricentro Manolo</div>
  </div>
</body>
</html>
